name: Download plugins

on:
  push:
    branches:
      - master
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Settings
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          RELEASES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$ENV_FILE" | grep -v '^GITHUB_TOKEN=' > .env
          echo "GITHUB_TOKEN=$RELEASES_TOKEN" >> .env

      - name: Run
        run: |
          ./setup.sh
          source env/bin/activate
          echo "Waiting for FlareSolverr..."
          sleep 60
          python redcraft_plugins_updater.py redcraft_plugins.json

      - name: Dump docker logs on failure
        if: failure()
        uses: jwalton/gh-docker-logs@v2

      - name: Keepalive
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/run.yml/enable
